<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
  // Aplica o tema salvo (ou a preferência do sistema) antes da primeira pintura,
  // evitando o "flash" do tema errado ao carregar a página.
  (function(){
    try{
      var saved = localStorage.getItem('athena-theme');
      var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
    }catch(e){}
  })();
</script>
<meta name="theme-color" id="themeColorMeta" content="#0B0B14">
<title>Athena — Fluxo Administrativo</title>
<link rel="icon" type="image/png" href="../assets/athena-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- TELA DE AUTENTICAÇÃO -->
<div id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="logo-wrap auth-logo">
      <img src="../assets/athena-logo.png" alt="Athena">
    </div>

    <div id="authTabs" class="auth-tabs">
      <button class="auth-tab active" data-tab="login" type="button">Entrar</button>
      <button class="auth-tab" data-tab="register" type="button">Criar conta</button>
    </div>

    <p id="authError" class="auth-error" role="alert"></p>

    <form id="loginForm" class="auth-form">
      <div class="field">
        <label for="loginEmail">E-mail</label>
        <input id="loginEmail" type="email" required placeholder="voce@empresa.com">
      </div>
      <div class="field">
        <label for="loginSenha">Senha</label>
        <input id="loginSenha" type="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="btn-primary auth-submit">Entrar</button>
    </form>

    <form id="registerForm" class="auth-form" hidden>
      <div class="field">
        <label for="regNome">Nome completo</label>
        <input id="regNome" type="text" required placeholder="Seu nome">
      </div>
      <div class="field">
        <label for="regEmail">E-mail</label>
        <input id="regEmail" type="email" required placeholder="voce@empresa.com">
      </div>
      <div class="field">
        <label for="regCargo">Cargo</label>
        <select id="regCargo" required></select>
      </div>
      <div class="field">
        <label for="regSenha">Senha</label>
        <input id="regSenha" type="password" required minlength="6" placeholder="Mínimo 6 caracteres">
      </div>
      <button type="submit" class="btn-primary auth-submit">Criar conta</button>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appScreen" hidden>
<header>
  <div class="brand">
    <button class="nav-toggle" id="navToggle" aria-label="Abrir menu de cargos" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <div class="logo-wrap">
    <img src="../assets/athena-logo.png" alt="Athena" class="logo-img">
    </div>
    <span class="brand-tagline">Fluxo Administrativo</span>
  </div>
  <div class="top-controls">
    <div class="user-badge" id="userBadge">
      <span class="user-badge-name" id="userName"></span>
      <span class="user-badge-cargo" id="userCargo"></span>
    </div>
    <button class="icon-btn" id="logoutBtn" aria-label="Sair" title="Sair">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="icon-btn" id="themeToggle" aria-label="Alternar tema claro/escuro" title="Alternar tema">
      <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="chatToggle" aria-label="Abrir chat" title="Chat da equipe">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 5h16v11H8l-4 4V5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<div class="scrim" id="scrim"></div>


<div class="layout">
  <aside>
    <h2>Cargos &amp; Setores</h2>
    <div id="cargoList"></div>
  </aside>

  <main>
    <div class="board-head">
      <div>
        <h2>Quadro de Tarefas</h2>
        <p>Toque num cartão para ver as instruções ou encaminhar.</p>
      </div>
      <button class="btn-primary" id="newTaskBtn">+ Nova tarefa</button>
    </div>

    <div class="board">
      <div class="column col-pendente">
        <div class="col-title">Pendente <span class="count" id="countPendente">0</span></div>
        <div id="colPendente"></div>
      </div>
      <div class="column col-execucao">
        <div class="col-title">Em Execução <span class="count" id="countExecucao">0</span></div>
        <div id="colExecucao"></div>
      </div>
      <div class="column col-concluido">
        <div class="col-title">Concluído <span class="count" id="countConcluido">0</span></div>
        <div id="colConcluido"></div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL NOVA TAREFA -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Nova tarefa</h2>
    <p class="sub">A Athena identifica automaticamente o cargo responsável.</p>
    <div class="field">
      <label for="taskTitle">Título</label>
      <input id="taskTitle" type="text" placeholder="Ex: Nota fiscal com erro">
    </div>
    <div class="field">
      <label for="taskDesc">Descrição</label>
      <textarea id="taskDesc" placeholder="Descreva o problema..."></textarea>
    </div>
    <div class="field">
      <label for="taskCategory">Categoria do problema</label>
      <select id="taskCategory"></select>
      <div class="routing-note" id="routingNote"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelTask">Cancelar</button>
      <button class="btn-primary" id="confirmTask">Criar tarefa</button>
    </div>
  </div>
</div>

<!-- CHAT -->
<div class="chat-panel" id="chatPanel">
  <div class="chat-head">
    <h2>Chat da equipe</h2>
    <button class="icon-btn" id="chatClose" aria-label="Fechar chat">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages"></div>
  <div class="chat-input">
    <input id="chatInput" type="text" placeholder="Escreva uma mensagem...">
    <button class="icon-btn" id="chatSend" aria-label="Enviar">➤</button>
  </div>
</div>

<footer>
  <p>&copy; 2026  Athena Code - Todos os direitos reservados</p>
</footer>
</div><!-- /#appScreen -->

<script src="../js/js.js"></script>
</body>
</html>
